<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    img { max-width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <img id="api-image" alt="Image dynamique" />

  <script>
    fetch('https://data.miratlas.com/api/v3/ism/oppenheimer037/allsky/latest')
      .then(response => response.json())
      .then(data => {
        // Remplacez 'image_url' par le nom exact de la clé dans votre JSON
        document.getElementById('api-image').src = data.url;
      })
      .catch(error => console.error('Erreur API :', error));
  </script>
</body>
</html>
