<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: transparent;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <img id="allsky-image" alt="Caméra AllSky en direct" />

  <script>
    // Ajoute l'heure actuelle (?t=...) pour forcer le rafraîchissement de l'image
    fetch('./data.json?t=' + new Date().getTime())
      .then(response => response.json())
      .then(data => {
        document.getElementById('allsky-image').src = json.data[0].url;
      })
      .catch(error => console.error('Erreur de chargement AllSky :', error));
  </script>
</body>
</html>
