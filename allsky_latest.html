<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    img {
      max-width: 100%;
      max-height: calc(100% - 35px);
      object-fit: contain;
      display: block;
    }
    #image-date {
      margin-top: 8px;
      font-size: 14px;
      color: #333333;
      text-align: center;
    }
  </style>
</head>
<body>
  <img id="allsky-image" alt="Caméra AllSky en direct" />
  <div id="image-date">Chargement de la date...</div>

  <script>
    const cacheBuster = new Date().getTime();

    // 1. Affiche la dernière image enregistrée
    document.getElementById('allsky-image').src = './allsky_latest.png?t=' + cacheBuster;

    // 2. Lit la date et l'heure dans le fichier JSON
    fetch('./data_allsky_latest.json?t=' + cacheBuster)
      .then(response => response.json())
      .then(json => {
        if (json.data && json.data.length > 0 && json.data[0].datetime) {
          const dateObj = new Date(json.data[0].datetime);
          
          // Formate en français (ex: "17/11/2026 à 16:44")
          const dateFormatee = dateObj.toLocaleDateString('fr-FR', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
          });
          const heureFormatee = dateObj.toLocaleTimeString('fr-FR', {
            hour: '2-digit',
            minute: '2-digit'
          });

          document.getElementById('image-date').textContent = `Prise de vue : ${dateFormatee} à ${heureFormatee}`;
        }
      })
      .catch(error => {
        console.error('Erreur de lecture de la date :', error);
        document.getElementById('image-date').textContent = '';
      });
  </script>
</body>
</html>
