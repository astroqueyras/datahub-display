name: Mise à jour de la dernière image de la caméra AllSky

on:
  schedule:
    - cron: '*/15 * * * *' # S'exécute toutes les 15 minutes
  workflow_dispatch:    # Permet de le lancer manuellement

permissions:
  contents: write

jobs:
  fetch-api:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers du dépôt
        uses: actions/checkout@v4

      - name: Appeler l'API avec le token secret
        env:
          TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          curl --silent --request GET \
            --url 'https://data.miratlas.com/api/v3/ism/oppenheimer037/allsky?latest=true' \
            --header 'Accept: application/json' \
            --header "X-Auth-Token: $TOKEN" \
            -o data.json

      - name: Sauvegarder le résultat sur GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add data.json
          git commit -m "Mise à jour automatique de l'image" || exit 0
          git push
