name: Mise à jour de la dernière image de la caméra AllSky via l'API DataHub

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-api:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers du dépôt
        uses: actions/checkout@v4

      - name: Récupérer le JSON et télécharger l'image
        env:
          TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          curl --silent --request GET \
            --url 'https://miratlas.com' \
            --header 'Accept: application/json' \
            --header "X-Auth-Token: $TOKEN" \
            -o data_allsky_latest.json

          IMAGE_URL=$(jq -r '.data.url' data_allsky_latest.json)

          curl --silent --location \
            --header "X-Auth-Token: $TOKEN" \
            "$IMAGE_URL" \
            -o allsky.png

      - name: Sauvegarder l'image sur GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add data_allsky_latest.json allsky.png
          git commit -m "Mise à jour automatique de l'image AllSky" || exit 0
          git push
